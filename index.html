<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>给你的手信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  height:100%;
  min-height:100vh;
  background: linear-gradient(180deg,#ffeaf3,#fff5f8,#ffdde1);
  font-family:"Noto Serif SC","PingFang SC","-apple-system",sans-serif;
  overflow-x:hidden;
}

body{
  padding:18px;
  padding-bottom:60px;
}

.container{
  max-width:100%;
  margin:0 auto;
  position:relative;
  z-index:10;
}

.card{
  background:rgba(255,255,255,0.96);
  padding:26px 22px;
  border-radius:22px;
  box-shadow:0 10px 35px rgba(255,80,120,0.22);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

.handwritten-title{
  font-family:"Ma Shan Zheng",cursive;
  font-size:36px;
  color:#d63384;
  text-align:center;
  margin-bottom:24px;
  letter-spacing:1px;
}

.text-box{
  font-size:16px;
  line-height:2.4;
  color:#444;
  white-space:pre-wrap;
  min-height:200px;
}

.cursor{
  display:inline-block;
  width:7px;
  background:#ff6b81;
  animation:blink 0.7s infinite;
}

@keyframes blink{
  0%{opacity:1}
  50%{opacity:0}
  100%{opacity:1}
}

.photo-gallery{
  margin-top:32px;
  display:flex;
  justify-content:center;
}

.photo-item{
  max-width:85%;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.28s ease,box-shadow 0.28s ease;
}

.photo-item img{
  width:100%;
  display:block;
  height:auto;
  border-radius:18px;
}

.photo-item:active{
  transform:scale(0.97);
}

.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}

.lightbox.active{
  opacity:1;
  pointer-events:auto;
}

.lightbox img{
  max-width:92vw;
  max-height:78vh;
  border-radius:12px;
}

.lightbox-close{
  position:absolute;
  top:20px;
  right:22px;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}

.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:#ff6b81;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 4px 14px rgba(255,80,120,0.4);
  z-index:100;
}

.music-btn.playing{
  background:#ec407a;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

.sakura{
  position:fixed;
  pointer-events:none;
  z-index:1;
  color:#ff9aa2;
  font-size:20px;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

.firework{
  position:fixed;
  pointer-events:none;
  z-index:5;
  border-radius:50%;
  animation:explode 1.2s ease-out forwards;
}

@keyframes explode{
  0%{
    transform:scale(0);
    opacity:1;
  }
  100%{
    transform:scale(3);
    opacity:0;
  }
}

@media(min-width:768px){
  .container{max-width:480px;}
  .photo-item{max-width:75%;}
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1 class="handwritten-title">给俊如的信</h1>
    <div class="text-box" id="msg"></div><span class="cursor"></span>

    <div class="photo-gallery">
      <div class="photo-item" onclick="openLightbox('photo1.jpg')">
        <img src="photo1.jpg" alt="photo">
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img src="" alt="大图" id="lightbox-img">
</div>

<div class="music-btn" id="musicBtn">♪</div>

<script>
const letterText = `
致俊如
又是喜欢俊如的一天，祝我们的第一个节日快乐！
我时常会想起一些小事，想起我们第一次见面。下课在门口初见你的那一刻，我就觉得这个女生笑得很阳光，有着很打动人的感染力，让人仿佛融化在春天里。
慢慢熟悉之后，我发现我们既有很多同频的地方，也存在不少不一样的地方。我愿意倾听你生活里的种种故事，而你也总能读懂我字里行间那些没有说出口的情绪。
我本身是一个刻意克制的人，从来不想去改变任何人，可却被你潜移默化地影响。不知道和我相伴同行的日子里，你会不会也在日常点滴里，感受到被我影响、被我感染的瞬间。
能够遇见你、认识你、陪伴你、拥有你，我满心欢喜，也倍感幸运。
其实我是一个害怕孤独的人，谢谢你一直陪在我的身边。哪怕现在我们远隔大洋彼岸，我无时无刻不盼望着，我们可以真正守在彼此左右：一起下厨，一起运动，好好享受生活。七月已经过去了，我十分怀念我们相处相伴的那些时光。
在我心里，最浪漫的从来不是什么宏大的桥段，而是实实在在的生活。我们都是平凡普通人，在相处之中互相治愈彼此。我也只想做一个普通人，和你在普通的日子里共度三餐四季，体味人间烟火；忙碌的时候彼此依靠，闲暇的时候，一起用脚步去丈量这个世界。
我们之间有着诸多不同，却一直能够互相理解、彼此包容。你总说我很理性，其实我只是不愿给出虚无缥缈的承诺。你有你的道理，我也有我的坚持。我可以接受生活里的种种不确定性，可同样也会畏惧未知。身处这个充满焦虑的时代，谁都会有缺少安全感的时候。
但无论如何，我都会支持你的想法，尊重你的选择。我始终觉得，人这一生最重要的就是开心。
我们相识已经一年多，时光流转，如同宇宙又老去一岁。我们也即将从校园踏入社会。当下的我们，难免迷茫、不知所措，会感到焦虑。但我相信，只要我们陪在彼此身边，互相鼓励、互相支撑，就能够在充满变数的未来里，守住属于我们那份确定的幸福与快乐。爱你。
我一定会很喜欢你，也会好好珍惜你的礼物，我也相信你同样会喜欢我的心意。
所以请你不要担心，不必惶恐，更不要给自己压力。你的心声和想法，我都会认真倾听，万事都有解决的办法。
你是我最好的女孩。往后，想和你一同看日出日落，观云卷云舒，赏潮起潮落，候花开花谢。
爱你的城子
`;

// 打字机速度：数字越大越慢
const dom = document.getElementById("msg");
let i = 0;
function type(){
  if(i < letterText.length){
    dom.innerText += letterText[i++];
    setTimeout(type, 145);
  }
}
type();

// 樱花飘落
// 樱花飘落（修改后：从屏幕最顶部外面开始下落）
function createSakura(){
  const sakura = document.createElement("div");
  sakura.className = "sakura";
  sakura.innerText = "🌸";
  sakura.style.left = Math.random() * 100 + "vw";
  sakura.style.top = "-30px"; // ✅新增，花瓣从屏幕顶部上方开始飘落
  sakura.style.fontSize = (14 + Math.random() * 18) + "px";
  sakura.style.opacity = 0.6 + Math.random() * 0.4;
  const dur = 5 + Math.random() * 7;
  sakura.style.animationDuration = dur + "s";
  document.body.appendChild(sakura);
  setTimeout(() => sakura.remove(), dur * 1000);
}
setInterval(createSakura, 260);

// 满屏烟花自动播放
function createFirework(x, y){
  const colors = ['#ff6b81', '#ff8fab', '#ff4757', '#ffd700', '#ffffff', '#ff9aa2'];

  for(let i = 0; i < 16; i++){
    const fw = document.createElement("div");
    fw.className = "firework";
    fw.style.left = x + "px";
    fw.style.top = y + "px";
    const s = 8 + Math.random() * 12;
    fw.style.width = s + "px";
    fw.style.height = s + "px";
    fw.style.background = colors[Math.floor(Math.random() * colors.length)];
    fw.style.transform = `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px)`;
    document.body.appendChild(fw);
    setTimeout(() => fw.remove(), 1200);
  }

  const bigGlow = document.createElement("div");
  bigGlow.className = "firework";
  bigGlow.style.left = x + "px";
  bigGlow.style.top = y + "px";
  bigGlow.style.width = "60px";
  bigGlow.style.height = "60px";
  bigGlow.style.background = "radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,107,129,0.6), transparent)";
  bigGlow.style.transform = "translate(-50%, -50%)";
  document.body.appendChild(bigGlow);
  setTimeout(() => bigGlow.remove(), 1200);
}

function autoFirework(){
  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight * 0.75;
  createFirework(x, y);
}

// 自动烟花频率：1.5秒一次，不会太卡
setInterval(autoFirework, 1500);

// 照片放大
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add("active");
}

function closeLightbox(){
  lightbox.classList.remove("active");
  lightboxImg.src = "";
}

lightbox.addEventListener("click", e => {
  if(e.target === lightbox) closeLightbox();
});

// iOS音乐按钮
const musicBtn = document.getElementById("musicBtn");
let audio = null;
let playing = false;

musicBtn.addEventListener("click", () => {
  if(!audio){
    audio = new Audio("bg.mp3");
    audio.loop = true;
  }

  if(playing){
    audio.pause();
    musicBtn.classList.remove("playing");
    playing = false;
  }else{
    audio.play().catch(err => console.log("audio play fail", err));
    musicBtn.classList.add("playing");
    playing = true;
  }
});
</script>

</body>
</html>
